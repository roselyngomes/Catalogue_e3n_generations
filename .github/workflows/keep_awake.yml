name: Maintenir l'app eveillee

# ---------------------------------------------------------------------------
# Declencheurs
# ---------------------------------------------------------------------------
on:
  # 1) Declenchement programme : toutes les 6 heures, a la minute pile.
  #    Les horaires cron de GitHub sont exprimes en UTC.
  #    "0 */6 * * *"  ->  00:00, 06:00, 12:00, 18:00 UTC
  #
  #    Attention : GitHub ne garantit pas la ponctualite. Les executions
  #    programmees sont mises en file d'attente et peuvent etre retardees
  #    de 5 a 60 minutes en periode de charge. C'est pourquoi on vise
  #    6 heures et non 11 : la marge absorbe les retards sans jamais
  #    atteindre le seuil de veille de 12 heures.
  schedule:
    - cron: "0 */6 * * *"

  # 2) Declenchement manuel : ajoute un bouton "Run workflow" dans
  #    l'onglet Actions du depot. Indispensable pour tester sans attendre.
  workflow_dispatch:
    inputs:
      url:
        description: "URL a visiter (laisser vide pour la valeur par defaut)"
        required: false
        default: ""

# ---------------------------------------------------------------------------
# Permissions : le workflow ne fait que lire le depot et sortir sur Internet.
# On applique le principe du moindre privilege.
# ---------------------------------------------------------------------------
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Empeche deux executions simultanees (par exemple un declenchement manuel
# pendant qu'une execution programmee tourne deja).
# ---------------------------------------------------------------------------
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    name: Visiter l'application Streamlit
    runs-on: ubuntu-latest

    # Garde-fou : si quelque chose se bloque, la machine est arretee au bout
    # de 10 minutes au lieu de consommer des heures de calcul.
    timeout-minutes: 10

    env:
      # URL par defaut. L'entree manuelle, si elle est renseignee, la remplace.
      APP_URL: ${{ inputs.url != '' && inputs.url || 'https://cataloguee3ngenerations.streamlit.app/' }}

    steps:
      # --- Etape 1 : recuperer le code du depot sur la machine virtuelle ---
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # --- Etape 2 : installer Python ---
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Etape 3 : installer Playwright et le navigateur Chromium ---
      #     "--with-deps" installe aussi les bibliotheques systeme Linux
      #     dont Chromium a besoin (polices, audio, rendu graphique).
      - name: Installer Playwright et Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      # --- Etape 4 : lancer le script ---
      - name: Visiter l'application
        run: python keep_awake.py "$APP_URL" --verbose

      # --- Etape 5 : en cas d'echec, conserver les captures d'ecran ---
      #     Elles restent telechargeables 7 jours depuis l'onglet Actions,
      #     ce qui permet de voir a quoi ressemblait la page au moment du
      #     probleme (page de veille inhabituelle, erreur Streamlit, etc.).
      - name: Conserver les captures de diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-echec
          path: captures/
          retention-days: 7
          if-no-files-found: ignore
